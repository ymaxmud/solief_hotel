name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. The lockfile is generated with this version, and npm
      # major versions disagree about which optional transitive entries belong in
      # it — npm 11 omits `@emnapi/runtime`, which npm 10 then rejects. Pinning
      # keeps `npm ci` reproducible instead of tracking the runner image default.
      - name: Pin npm
        run: npm i -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # Dummy values: env is read lazily by the Supabase client factories, so the
        # build only needs the vars to be present, never valid. Admin pages are
        # dynamic and are not rendered during the build.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key
          SUPABASE_SECRET_KEY: ci-dummy-secret-key
          NEXT_PUBLIC_SITE_URL: https://soliefhotel.com
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pin npm explicitly. The lockfile is generated with this version, and npm
      # major versions disagree about which optional transitive entries belong in
      # it — npm 11 omits `@emnapi/runtime`, which npm 10 then rejects. Pinning
      # keeps `npm ci` reproducible instead of tracking the runner image default.
      - name: Pin npm
        run: npm i -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Dummy Supabase values on purpose: CI must never depend on the
        # production database. The specs assert public rendering, validation and
        # access control, plus the fail-closed behaviour when persistence is
        # unavailable.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key
          SUPABASE_SECRET_KEY: ci-dummy-secret-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
